# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml

configSchema:
  type: object
  required:
    - gitlabPersonalAccessToken
  properties:
    gitlabPersonalAccessToken:
      type: string
      description: GitLab Personal Access Token for local stdio use
    gitlabApiUrl:
      type: string
      description: GitLab API base URL (e.g. https://gitlab.com/api/v4)
      default: https://gitlab.com/api/v4
    gitlabPermissionMode:
      type: string
      enum: [readonly, modify, full]
      description: Permission mode. readonly hides every write tool, modify blocks delete and teardown tools, full allows everything
      default: full
    gitlabToolsets:
      type: string
      description: Optional comma-separated list of toolsets to enable (e.g. projects,issues,merge_requests,pipelines)
    gitlabMaskingEnabled:
      type: boolean
      description: Enable built-in text-response masking for GitLab tokens and IP addresses
      default: false

startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - gitlabPersonalAccessToken
    properties:
      gitlabPersonalAccessToken:
        type: string
        description: GitLab Personal Access Token for local stdio use
      gitlabApiUrl:
        type: string
        description: GitLab API base URL (e.g. https://gitlab.com/api/v4)
        default: https://gitlab.com/api/v4
      gitlabPermissionMode:
        type: string
        enum: [readonly, modify, full]
        description: Permission mode. readonly hides every write tool, modify blocks delete and teardown tools, full allows everything
        default: full
      gitlabToolsets:
        type: string
        description: Optional comma-separated list of toolsets to enable (e.g. projects,issues,merge_requests,pipelines)
      gitlabMaskingEnabled:
        type: boolean
        description: Enable built-in text-response masking for GitLab tokens and IP addresses
        default: false
  commandFunction: |-
    (config) => ({
      command: 'node',
      args: ['build/index.js'],
      env: {
        GITLAB_PERSONAL_ACCESS_TOKEN: config.gitlabPersonalAccessToken,
        ...(config.gitlabApiUrl ? { GITLAB_API_URL: config.gitlabApiUrl } : {}),
        ...(config.gitlabPermissionMode ? { GITLAB_PERMISSION_MODE: config.gitlabPermissionMode } : {}),
        ...(config.gitlabToolsets ? { GITLAB_TOOLSETS: config.gitlabToolsets } : {}),
        ...(config.gitlabMaskingEnabled !== undefined ? { GITLAB_MASKING_ENABLED: String(config.gitlabMaskingEnabled) } : {})
      }
    })
  exampleConfig:
    gitlabPersonalAccessToken: glpat-dummy-token
    gitlabApiUrl: https://gitlab.com/api/v4
