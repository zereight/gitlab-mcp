name: MCP Bundle

on:
  release:
    types: [published]
  pull_request:
    branches: [main]
    paths:
      - manifest.json
      - scripts/pack-mcpb.sh
      - .github/workflows/mcpb-release.yml
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the bundle to (e.g. v2.4.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  mcpb:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Pack MCP Bundle
        run: npm run pack:mcpb

      # Stable asset name so releases/latest/download/gitlab-mcp.mcpb always resolves.
      - name: Attach bundle to release
        if: github.event_name != 'pull_request'
        run: gh release upload "$TAG" gitlab-mcp.mcpb --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
