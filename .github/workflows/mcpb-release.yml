name: MCP Bundle

on:
  release:
    types: [published]
  pull_request:
    branches: [main]
    paths:
      - manifest.json
      - package.json
      - scripts/pack-mcpb.sh
      - .github/workflows/mcpb-release.yml
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the bundle to (e.g. v2.4.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  mcpb:
    # A GitHub pre-release must not replace the bundle behind
    # releases/latest/download/gitlab-mcp.mcpb.
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    # contents: write uploads release assets. id-token and attestations
    # sign the bundle's build provenance on release runs only.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.22.2"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Pack MCP Bundle
        run: npm run pack:mcpb

      # Signed SLSA build provenance for the bundle, stored in the repository's
      # attestations (check with `gh attestation verify gitlab-mcp.mcpb
      # --repo zereight/gitlab-mcp`) and attached to the release below.
      - name: Attest bundle provenance
        id: attest
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: gitlab-mcp.mcpb

      # Stable asset names so releases/latest/download/gitlab-mcp.mcpb always resolves.
      - name: Attach bundle to release
        if: github.event_name != 'pull_request'
        run: |
          cp "$BUNDLE_PATH" gitlab-mcp.mcpb.sigstore.json
          gh release upload "$TAG" gitlab-mcp.mcpb gitlab-mcp.mcpb.sigstore.json --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
