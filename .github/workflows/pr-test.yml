name: PR Test and Validation

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22.21.1'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --ignore-scripts

    - name: Build project
      run: npm run build

    - name: Check runtime dependencies
      run: npm run check:runtime-deps

    - name: Run consumer install smoke test
      run: npm run test:consumer-smoke

    - name: Run mock tests
      run: npm run test:mock

    - name: Type check
      run: npx tsc --noEmit

    - name: Lint check
      run: npm run lint

    - name: Check package size
      run: |
        npm pack --dry-run --ignore-scripts
        echo "Package created successfully"

    - name: Security audit
      run: npm audit --production

  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Test Docker build
      run: |
        docker build -t mcp-gitlab-test .
        echo "Verifying Docker image contains built files..."
        docker run --rm --entrypoint "" mcp-gitlab-test ls -la build/index.js
        echo "Verifying MCP Registry label matches server.json name..."
        test "$(docker inspect --format '{{ index .Config.Labels "io.modelcontextprotocol.server.name" }}' mcp-gitlab-test)" = "$(jq -r .name server.json)"
        echo "Docker build verification passed"

  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22.21.1'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --ignore-scripts

    - name: Check code formatting
      run: npm run format:check

    - name: Check for console.log statements
      run: |
        if grep -r "console\.log" --include="*.ts" --exclude-dir=node_modules --exclude-dir=build --exclude="test*.ts" .; then
          echo "Warning: Found console.log statements in source code"
        else
          echo "No console.log statements found"
        fi

    - name: Check for TODO comments
      run: |
        if grep -r "TODO\|FIXME\|XXX" --include="*.ts" --exclude-dir=node_modules --exclude-dir=build .; then
          echo "Warning: Found TODO/FIXME comments"
        else
          echo "No TODO/FIXME comments found"
        fi

  docs-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      # actions/checkout@v4 — pin to commit SHA for supply-chain safety
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        # Drop the GITHUB_TOKEN credential after checkout; this job only
        # needs read access to the working tree.
        persist-credentials: false

    - name: Setup Node.js
      # actions/setup-node@v4
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '22.21.1'
        cache: 'npm'

    - name: Install Node dependencies
      run: npm ci --ignore-scripts

    - name: Regenerate generated docs
      run: npm run docs:tools

    # Blocking for same-repo PRs and manual runs. Informational for fork PRs:
    # tool-docs-sync.yml regenerates these files on main after merge, so
    # outside contributors do not need to run `make tools-docs`.
    - name: Check for generated-docs drift
      env:
        IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      run: |
        if ! git diff --exit-code -- docs/tools/ docs/reference/tool-coverage.md || [ -n "$(git ls-files --others --exclude-standard -- docs/tools/ docs/reference/tool-coverage.md)" ]; then
          git status --porcelain -- docs/tools/ docs/reference/tool-coverage.md
          if [ "$IS_FORK_PR" = "true" ]; then
            echo "::notice::Generated docs differ from this PR. No action needed: a bot PR syncs them on main after merge."
            exit 0
          fi
          echo "::error::Generated docs are out of sync. Run 'make tools-docs' and commit the result."
          exit 1
        fi

    - name: Check skill catalog sync
      run: npm run check:skill-sync

    - name: Set up Python
      # actions/setup-python@v5
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: "3.12"
        cache: "pip"
        cache-dependency-path: requirements-docs.txt

    - name: Install docs dependencies
      run: pip install -r requirements-docs.txt

    - name: Build site (strict)
      run: mkdocs build --strict
