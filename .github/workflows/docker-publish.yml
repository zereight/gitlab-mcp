name: Docker Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag without v (e.g., 2.3.6) or latest. Run from the matching release tag.'
        required: true
        default: 'latest'

permissions:
  contents: read

jobs:
  docker:
    # A GitHub pre-release must not move the `latest` image tag.
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    # Fail fast instead of burning the full 6h when a platform leg hangs.
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for Docker (Release)
        if: github.event_name == 'release'
        id: meta-release
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: zereight050/gitlab-mcp
          tags: |
            type=semver,pattern={{version}}
            latest

      - name: Set tags for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        id: meta-manual
        run: |
          echo "tags=zereight050/gitlab-mcp:${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT

      # Provenance and SBOM attestations are pushed with the image, as one
      # attestation manifest per platform in the image index. Pin
      # provenance explicitly instead of relying on the action's default.
      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ github.event_name == 'release' && steps.meta-release.outputs.tags || steps.meta-manual.outputs.tags }}

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: zereight050/gitlab-mcp
          readme-filepath: ./docker/DOCKERHUB.md
          short-description: GitLab MCP server for projects, merge requests, issues, pipelines, wiki, releases, and more
          enable-url-completion: true
