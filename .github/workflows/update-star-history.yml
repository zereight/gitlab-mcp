name: Update Star History

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-star-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"

      - run: python -m pip install pillow

      - name: Generate chart
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/generate-star-history.py

      - name: Open update PR
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          branch: automation/update-star-history
          title: "docs: update Star History chart"
          commit-message: "docs: update Star History chart"
          body: "Automated weekly refresh of `assets/star-history.png`."
          add-paths: assets/star-history.png
