name: MCP Registry Publish
run-name: MCP Registry Publish ${{ github.event.workflow_run.head_branch || inputs.ref || github.ref_name }}

# Runs after Docker Publish finishes, so the image tag listed in server.json
# already exists when the registry checks it. workflow_run matches Docker
# Publish by its `name:` and always runs this file from the default branch;
# the job checks out the release commit itself. Use workflow_dispatch to
# retry by hand.
on:
  workflow_run:
    workflows: ["Docker Publish"]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to publish, such as a release tag, branch, or SHA. Defaults to the current ref."
        required: false
        type: string

permissions:
  contents: read
  id-token: none

jobs:
  check-release:
    # Only a successful Docker Publish run for a release in this repository.
    # Docker Publish's own workflow_dispatch runs and failed runs skip.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'release' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      # workflow_run carries no release payload. For a release run,
      # head_branch is the release tag, so ask the API whether it is a
      # pre-release. A pre-release must not change the registry entry.
      - name: Check for a pre-release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ "$EVENT_NAME" != "workflow_run" ]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          prerelease="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)"
          echo "Release ${TAG}: prerelease=${prerelease}"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"

  publish:
    needs: check-release
    if: needs.check-release.outputs.prerelease == 'false'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest

    steps:
      # On workflow_run, github.sha is the default branch head; head_sha is the
      # commit Docker Publish built, which is the release tag's commit.
      - name: Checkout release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.ref || github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.21.1"
          registry-url: "https://registry.npmjs.org/"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Install mcp-publisher
        env:
          GH_TOKEN: ${{ github.token }}
          MCP_PUBLISHER_VERSION: v1.7.8
        run: |
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          asset="mcp-publisher_${os}_${arch}.tar.gz"
          checksums="registry_${MCP_PUBLISHER_VERSION#v}_checksums.txt"

          gh release download "$MCP_PUBLISHER_VERSION" \
            --repo modelcontextprotocol/registry \
            --pattern "$asset" \
            --pattern "$checksums" \
            --pattern "$checksums.sigstore.json" \
            --dir .

          cosign verify-blob "$checksums" \
            --bundle "$checksums.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

          grep "  ${asset}$" "$checksums" | sha256sum -c -
          tar xzf "$asset" mcp-publisher
          chmod +x mcp-publisher
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Validate registry metadata
        run: |
          npm run release:mcp-registry -- --check
          mcp-publisher validate server.json

      - name: Wait for npm package
        run: |
          PACKAGE_NAME="$(node -p 'require("./package.json").name')"
          PACKAGE_VERSION="$(node -p 'require("./package.json").version')"

          for attempt in {1..30}; do
            if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version; then
              exit 0
            fi

            echo "Package ${PACKAGE_NAME}@${PACKAGE_VERSION} is not visible on npm yet. Retry ${attempt}/30..."
            sleep 10
          done

          echo "Package ${PACKAGE_NAME}@${PACKAGE_VERSION} was not visible on npm after waiting."
          exit 1

      # The registry fetches the image label at publish time. After Docker
      # Publish the tag is already pushed, so a short wait covers Docker Hub
      # lag. A manual dispatch may run before or alongside Docker Publish, so
      # it waits through Docker Publish's 40-minute timeout.
      - name: Wait for Docker image
        env:
          ATTEMPTS: ${{ github.event_name == 'workflow_run' && '10' || '90' }}
        run: |
          IMAGE="$(node -p "require('./server.json').packages.find((pkg) => pkg.registryType === 'oci')?.identifier ?? ''")"
          if [ -z "$IMAGE" ]; then
            echo "No OCI package in server.json. Skipping."
            exit 0
          fi

          case "$IMAGE" in
            docker.io/*) ;;
            *)
              echo "Unsupported OCI registry for ${IMAGE}; only docker.io is polled."
              exit 1
              ;;
          esac

          # Docker Hub tags API: 200/404 without spending anonymous pull quota.
          REF="${IMAGE#docker.io/}"
          TAG_URL="https://hub.docker.com/v2/repositories/${REF%:*}/tags/${REF##*:}"

          for attempt in $(seq 1 "$ATTEMPTS"); do
            STATUS="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$TAG_URL" || true)"
            if [ "$STATUS" = "200" ]; then
              exit 0
            fi

            echo "Image ${IMAGE} is not visible yet (HTTP ${STATUS}). Retry ${attempt}/${ATTEMPTS}..."
            sleep 30
          done

          echo "Image ${IMAGE} was not visible after waiting."
          exit 1

      - name: Authenticate to MCP Registry
        run: mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: npm run release:mcp-registry
